name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  # The same suite with MySQL / PostgreSQL instead of in-memory SQLite
  # (AVEROA_TEST_DB_URL, see tests/helpers.js).
  mysql:
    name: MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: averoa_test
          MYSQL_USER: averoa
          MYSQL_PASSWORD: averoa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      AVEROA_TEST_DB_URL: mysql://averoa:averoa@127.0.0.1:3306/averoa_test
      # Node.js in another time zone than the server (UTC): exercises DB_TIMEZONE
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test

  postgres:
    name: PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: averoa
          POSTGRES_PASSWORD: averoa
          POSTGRES_DB: averoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U averoa -d averoa_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AVEROA_TEST_DB_URL: postgres://averoa:averoa@127.0.0.1:5432/averoa_test
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      # the boilerplate ships mysql2 only; pg is what an app on PostgreSQL adds
      - name: Install the PostgreSQL driver
        run: npm install --no-save --no-audit --no-fund pg@^8.23.1
      - name: Test
        run: npm test

  # Every starter (starters/<name>): scaffolded with create-averoa from this checkout,
  # then the generated app's own tests and lint, plus a generator run.
  starters:
    name: Starter ${{ matrix.starter }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        starter: [minimal, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Create the app
        env:
          STARTER: ${{ matrix.starter }}
        run: npx --yes create-averoa@^1.1.0 "$RUNNER_TEMP/app" --template . --starter "$STARTER" --no-git --yes
      - name: Test
        working-directory: ${{ runner.temp }}/app
        run: npm test
      - name: Lint
        working-directory: ${{ runner.temp }}/app
        run: npm run lint
      - name: Generators
        working-directory: ${{ runner.temp }}/app
        run: |
          node averoa.js make:crud books
          node averoa.js make:test books --http
          npm run lint
          npm test
